
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Harsh — Frontend Developer</title>
  <desc id="desc">A warm cream-and-brown animated cat above Harsh's frontend developer profile banner.</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="80%">
      <stop offset="0" stop-color="#3E1C0D"/>
      <stop offset="1" stop-color="#160B06"/>
    </radialGradient>

    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1DF"/>
      <stop offset=".55" stop-color="#FEE6C9"/>
      <stop offset="1" stop-color="#D9B995"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FEE6C9"/>
      <stop offset=".52" stop-color="#B98B65"/>
      <stop offset="1" stop-color="#77563A"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0" stop-color="#FEE6C9" stop-opacity=".24"/>
      <stop offset="1" stop-color="#FEE6C9" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .display {
        font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
        font-weight: 800;
      }

      .label {
        font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
        font-weight: 600;
      }

      @media (prefers-reduced-motion: reduce) {
        .float, .tail, .blink, .sparkle {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="560" fill="url(#bg)"/>

  <ellipse cx="600" cy="230" rx="180" ry="70" fill="url(#glow)"/>

  <ellipse cx="600" cy="247" rx="104" ry="15"
    fill="#FEE6C9" opacity=".14" filter="url(#softGlow)">
    <animate attributeName="opacity"
      values=".14;.07;.14" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Animated Cat Mascot -->
  <g class="float">
    <animateTransform attributeName="transform"
      type="translate"
      values="0 0;0 -9;0 0"
      dur="4.8s"
      repeatCount="indefinite"/>

    <!-- Tail -->
    <path d="M682 202 C738 190 746 140 717 132 C697 126 688 147 704 157"
      fill="none"
      stroke="#FEE6C9"
      stroke-width="17"
      stroke-linecap="round">
      <animate attributeName="d"
        values="
        M682 202 C738 190 746 140 717 132 C697 126 688 147 704 157;
        M682 202 C742 190 755 151 727 143 C707 137 697 157 711 166;
        M682 202 C738 190 746 140 717 132 C697 126 688 147 704 157"
        dur="3.2s"
        repeatCount="indefinite"/>
    </path>

    <!-- Ears -->
    <path d="M526 126 L516 62 Q514 48 528 57 L574 99Z"
      fill="url(#fur)" stroke="#77563A" stroke-width="3"/>

    <path d="M674 126 L684 62 Q686 48 672 57 L626 99Z"
      fill="url(#fur)" stroke="#77563A" stroke-width="3"/>

    <path d="M531 103 L526 73 L555 99Z"
      fill="#B98278" opacity=".9"/>

    <path d="M669 103 L674 73 L645 99Z"
      fill="#B98278" opacity=".9"/>

    <!-- Cat Head -->
    <path d="M600 82 C545 82 505 119 505 169
      C505 220 544 244 600 244
      C656 244 695 220 695 169
      C695 119 655 82 600 82Z"
      fill="url(#fur)"
      stroke="#77563A"
      stroke-width="3"/>

    <!-- Forehead Marking -->
    <path d="M583 88 Q600 112 617 88
      Q614 122 600 132
      Q586 122 583 88Z"
      fill="#77563A"
      opacity=".95"/>

    <!-- Cheeks -->
    <ellipse cx="548" cy="190" rx="23" ry="12"
      fill="#D99B8C" opacity=".42"/>

    <ellipse cx="652" cy="190" rx="23" ry="12"
      fill="#D99B8C" opacity=".42"/>

    <!-- Blinking Eyes -->
    <g fill="#3E1C0D">
      <ellipse cx="565" cy="165" rx="8" ry="12">
        <animate attributeName="ry"
          values="12;12;1;12;12"
          keyTimes="0;.42;.45;.48;1"
          dur="4.4s"
          repeatCount="indefinite"/>
      </ellipse>

      <ellipse cx="635" cy="165" rx="8" ry="12">
        <animate attributeName="ry"
          values="12;12;1;12;12"
          keyTimes="0;.42;.45;.48;1"
          dur="4.4s"
          repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- Eye Highlights -->
    <circle cx="568" cy="161" r="2.5" fill="#FFF8EF"/>
    <circle cx="638" cy="161" r="2.5" fill="#FFF8EF"/>

    <!-- Nose -->
    <path d="M594 188 Q600 183 606 188 Q600 196 594 188Z"
      fill="#9B6258"/>

    <!-- Smile -->
    <path d="M600 195 Q590 207 581 198
      M600 195 Q610 207 619 198"
      fill="none"
      stroke="#77563A"
      stroke-width="2.5"
      stroke-linecap="round"/>

    <!-- Whiskers -->
    <g stroke="#77563A" stroke-width="2"
      stroke-linecap="round" opacity=".8">
      <path d="M548 190 L516 184"/>
      <path d="M548 198 L516 201"/>
      <path d="M652 190 L684 184"/>
      <path d="M652 198 L684 201"/>
    </g>

    <!-- Collar -->
    <path d="M554 238 Q600 259 646 238"
      fill="none"
      stroke="#77563A"
      stroke-width="5"
      stroke-linecap="round"/>

    <!-- Collar Charm -->
    <path d="M600 249 L607 257 L600 266 L593 257Z"
      fill="#B98B65"
      stroke="#FEE6C9"
      stroke-width="1.5"/>
  </g>

  <!-- Floating Sparkles -->
  <g fill="#FEE6C9" opacity=".8">

    <path d="M478 133 l4 11 11 4 -11 4 -4 11
      -4 -11 -11 -4 11 -4Z">
      <animate attributeName="opacity"
        values=".2;1;.2"
        dur="2.6s"
        repeatCount="indefinite"/>
    </path>

    <path d="M724 92 l3 8 8 3 -8 3 -3 8
      -3 -8 -8 -3 8 -3Z">
      <animate attributeName="opacity"
        values="1;.25;1"
        dur="3s"
        repeatCount="indefinite"/>
    </path>

    <circle cx="752" cy="207" r="3">
      <animate attributeName="opacity"
        values=".2;1;.2"
        dur="2.2s"
        repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Name -->
  <text x="600" y="352"
    text-anchor="middle"
    class="display"
    font-size="66"
    fill="#FEE6C9"
    letter-spacing="2">
    Hi 👋, I'm Harsh
  </text>

  <!-- Decorative Accent Line -->
  <rect x="440" y="380"
    width="320"
    height="4"
    rx="2"
    fill="url(#accent)"
    filter="url(#softGlow)"/>

  <!-- Profession -->
  <text x="600" y="424"
    text-anchor="middle"
    class="label"
    font-size="22"
    fill="#D7B99A"
    letter-spacing="8">
    FRONTEND DEVELOPER
  </text>

  <!-- Social Handles -->
  <g fill="#D7B99A">

    <!-- GitHub Icon -->
    <g transform="translate(442 466) scale(.92)">
      <path d="M12 .297c-6.63 0-12 5.373-12 12
        0 5.303 3.438 9.8 8.205 11.385
        .6.113.82-.258.82-.577
        0-.285-.01-1.04-.015-2.04
        -3.338.724-4.042-1.61-4.042-1.61
        C4.422 18.07 3.633 17.7 3.633 17.7
        c-1.087-.744.084-.729.084-.729
        1.205.084 1.838 1.236 1.838 1.236
        1.07 1.835 2.809 1.305 3.495.998
        .108-.776.417-1.305.76-1.605
        -2.665-.3-5.466-1.332-5.466-5.93
        0-1.31.465-2.38 1.235-3.22
        -.135-.303-.54-1.523.105-3.176
        0 0 1.005-.322 3.3 1.23
        .96-.267 1.98-.399 3-.405
        1.02.006 2.04.138 3 .405
        2.28-1.552 3.285-1.23 3.285-1.23
        .645 1.653.24 2.873.12 3.176
        .765.84 1.23 1.91 1.23 3.22
        0 4.61-2.805 5.625-5.475 5.92
        .42.36.81 1.096.81 2.22
        0 1.606-.015 2.896-.015 3.286
        0 .315.21.69.825.57
        C20.565 22.092 24 17.592 24 12.297
        c0-6.627-5.373-12-12-12"/>
    </g>

    <text x="474" y="484"
      class="label"
      font-size="15"
      letter-spacing="1">
      @Harshjs-Gupta
    </text>

    <!-- X Icon -->
    <g transform="translate(672 467) scale(.88)">
      <path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846
        h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154
        h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24
        H4.298Z"/>
    </g>

    <text x="702" y="484"
      class="label"
      font-size="15"
      letter-spacing="1">
      @harshgupta_js
    </text>

  </g>
</svg>
